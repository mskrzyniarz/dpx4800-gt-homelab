"metadata":
  "categories":
    - "monitoring"
  "changelog_url": "https://github.com/amir20/dozzle/releases"
  "description": "Realtime log viewer for docker containers."
  "home": "https://dozzle.dev"
  "host_mounts":
    - "description": "Docker socket"
      "host_path": "/var/run/docker.sock"
  "icon": "data:image/svg+xml;base64,"
  "keywords":
    - "logs"
  "name": "dozzle"
  "run_as_context":
    - "description": "Container [dozzle] can run as ${PUID_NAME} user and ${PGID_NAME} group."
      "gid": ${PGID}
      "group_name": "Host group is [${PGID_NAME}]"
      "uid": ${PUID}
      "user_name": "Host user is [${PUID_NAME}]"
  "sources":
    - "https://github.com/amir20/dozzle"
  "title": "Dozzle"
  "train": "community"
"notes": |
  # Dozzle [YAML] [Custom App]

  Dozzle is a simple, lightweight log viewer for Docker containers. It allows you to view logs from all your containers in real-time, with a clean and user-friendly interface.

  ## Security

  **Read the following security precautions to ensure that you wish to continue using this application.**

  ---

  ### Container: [dozzle]

  #### Running user/group(s)

  - User: ${PUID_NAME}
  - Group: ${PGID_NAME}
  - Supplementary Groups: apps, docker

  #### Passing Host Files, Devices, or Sockets into the Container

  - Docker Socket (/var/run/docker.sock) - (Read Only)
"portals":
  "Web UI": "http://0.0.0.0:${DOZZLE_PORT}/"
