"notes": |
  # Code Server [YAML] [Custom App]

  Code Server is VS Code in the browser, allowing you to develop from anywhere with a full-featured code editor.

  ## Security

  **Read the following security precautions to ensure that you wish to continue using this application.**

  ---

  ### Container: [code-server]

  #### Running user/group(s)

  - User: ${PUID}
  - Group: ${PGID}
  - Supplementary Groups: apps

  ---

  In order to install additional packages in the code-server container,
  you need to shell into the container as root. You can do this by running the following command:

  ```sh
  docker exec -it --user root <container_name> /bin/bash
  ```

  Note that packages installed will be lost when the container is updated or re-created.
"portals":
